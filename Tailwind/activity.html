<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity</title>
    <link rel="stylesheet" href="activity.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="mt-20 mx-52 flex flex-wrap rounded-lg border-2 border-black">
      <!-- Quote Container -->
      <div
        class="bg-linear-to-t from-sky-500 to-indigo-500 h-24 text-xl text-white flex justify-center items-center font-bold w-full rounded-t"
      >
        News you can Trust
      </div>
      <!-- Content Container -->
      <div class="text-center mt-6 w-full">
        <h3 class="text-l font-semibold">Stay up to date with Latest!</h3>
        <p>
          Subscribe to our newsletter for the latest news straight into your
          inbox
        </p>
        <form class="flex flex-wrap">
          <input
            placeholder="you@gmail.com"
            class="w-full mx-52 text-center bg-slate-200 my-4 py-2 placeholder:text-sm rounded"
          />
          <button class="w-full bg-sky-500 text-white mx-52 py-2 rounded-full">
            Subscribe Now
          </button>
        </form>
        <p class="mt-6 text-sm">you value your privacy</p>
      </div>
    </div>
  </body>
</html>
