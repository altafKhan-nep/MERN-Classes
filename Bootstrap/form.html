<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Form</title>
</head>
<body>
    <h2>Form Demo</h2>
    <div class="container">

   
        <form>
            <div class="row">
                <!-- emai -->
                <div class="mb-3 col-md-6">
                    <label for="email" class="form-label">Email address </label>
                    <input 
                     type="email"
                     id="email" 
                     placeholder="Email"
                     class="form-control" >
                     <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                </div>
                <!-- password -->
                <div class="mb-3 col-md-6">
                    <label for="password" class="form-label">Password </label>
                    <input 
                     type="password"
                     id="password" 
                     placeholder="password"
                     class="form-control" >
                </div>
            </div>
            
           
            <div class="mb-3">
                <select class="form-select">
                    <option value="1" selected>Choose Your Capital City</option>
                    <option value="2"> Kathmandu</option>
                    <option value="3"> Tehran</option>
                    <option value="2"> Jerusalam</option>
                </select>
            </div>

            <div class="md-3">
                <input type="checkbox" id="check-btn" class="form-check-input">
                <label for="check-btn" class="form-check-label">Are You Agree 18+</label>
            </div>

           <div class="mb-3">
            <input type="radio" id="radio-btn" class="form-check-input">
            <label for="radio-btn" class="form-check-label">check</label>
           </div>
           
           <div class="mb-3 checkbox form-switch">
            <input type="checkbox" id="swtch" class="form-check-input">
            <label for="swtch" class="form-check-label">Dark Mode</label>
           </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>     
        <script src="https://cdn.jsdelivr.rnet/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
