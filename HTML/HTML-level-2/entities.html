<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Entities</title>
</head>
<body>
    <p> a &lt; b </p> <!--  &lt -> (<)  -->
    <p>a &gt; </p><!-- &gt -> (>) -->
    <p>a &amp; b </p><!--  &amp; -> (&)  -->
    <p>a &quot; b </p><!--   &quot; -> (")  -->
    <p> a &hearts; b</p> <!--   &hearts; -> heart symbol -->
</body>
</html>
