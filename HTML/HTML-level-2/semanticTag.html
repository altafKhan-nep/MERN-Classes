<!-- semantic means the tag with meaningfull name
    article tag -> store article
    section tag -> store relted content
    aside tag ->store related links/content
    
 NAV TAG (Navigation tag) : 
        The <nav> HTML element represents a section of a page whose 
            purpose is to provide navigation links, either within
             the current document or to other documents.
              Common examples of navigation sections are
               menus, tables of contents, and indexes.
-->
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tag</title>
</head>
<body>
    <header>Apna College
        <nav>
            <ul>
                <li><a href="/contact.html">Contact us </a></li>
                <li><a href="/about.html">about us</a></li>
            </ul>
        </nav>
    </header>
    <main>This is main content.</main>
    <footer>This made with &heart;</footer>
</body>
</html>
