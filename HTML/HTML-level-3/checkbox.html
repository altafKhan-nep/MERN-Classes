<head>
    <meta charset="UTF-8">

    <title>Checkbox</title>
</head>
<body>
    <form action="/server">
        <input type="checkbox" name="age" id="age" checked>
        <label for="age">I am 18+</label>
        <button>submit</button>
    </form>
<hr>
<form action="/server">

    <input type="checkbox" name="fruit" id="Apple" value="Apple">
    <label for="Apple">Apple</label>

    <input type="checkbox" name="fruit" id="Mango" value="Mango">

    <input type="checkbox" name="fruit" id="Grapes" value="Grapes">

</form>
</body>
</html>
