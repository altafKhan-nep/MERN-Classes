<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form action="/action.php">
        <caption>Registration Form </caption>
        <div>
            <input type="text" id="first" placeholder="First Name" name="fname">
            <input type="text" id="last" placeholder="Last Name" name="lname">
        </div>
       

        <div>
            <label for="gender">Please Select Gender </label>
        <select name="gender" id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        </div>
        <div>
            Do you agree to all time of service?
            <input type="checkbox" id="tick" name="val" >
            <label for="tick">Yes, I agree</label>
        </div>
        <div>
            <button>Register</button>
        </div>
    </form>
</body>
</html>
