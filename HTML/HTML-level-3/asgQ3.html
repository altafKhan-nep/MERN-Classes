<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3(feedback form)</title>
</head>
<body>
    <form action="/no server">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <div>
            <label for="msg">Message:</label>
            <textarea name="feedback" id="msg"></textarea>
        </div>
        <div>
            <label for="rating">Rate us our of 5:</label>
            <br>
            <input type="radio" id="5" name="rating">
            <label for="5">5</label>
            <br>
            <input type="radio" id="4" name="rating">
            <label for="4">4</label>
            <br>
            <input type="radio" id="3" name="rating">
            <label for="3">3</label>
            <br>
            <input type="radio" id="2" name="rating">
            <label for="2">2</label>
            <br>
            <input type="radio" id="1" name="rating">
            <label for="1">1</label>
            <br>
        </div>
        <button>Send us message!</button>
    </form>
</body>
</html>
