<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
</head>
<body>
    <table>
        <caption>Food Menu</caption>
        <!-- Table Header -->
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>
        <!-- Table Body -->
       <tbody>
        <tr>
            <td>Olive</td>
            <td>Rs. 3000</td>
        </tr>
        <tr>
            <td>Mango</td>
            <td>Rs. 230</td>
        </tr>
        <tr>
            <td>Orange</td>
            <td>Rs. 150</td>
        </tr>
       </tbody>
        <!-- Table Footer -->
         <tfoot>
            <tr>
                <td>Total</td>
                <td>Rs. 3380</td>
            </tr>
         </tfoot>
    </table>
    
</body>
</html>
