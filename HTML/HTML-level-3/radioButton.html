<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Button</title>
</head>
<body>
    <form action="/server">
        <input type="radio" name="fruit" id="Olive" value="Olive">
        <label for="Olive">Olive</label>

        <input type="radio" name="fruit" id="Apple" value="Apple">
        <label for="Apple">Apple</label>

        <input type="radio" name="fruit" id="Mango" value="Mango">
        <label for="Mango">Mango</label>
        <input type="radio" name="fruit" id="Grapes" value="Grapes">
        <label for="Grapes">Grapes</label>
        <button>Submit</button>
    </form>
</body>
</html>
