<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range</title>
</head>
<body>
    <form action="/server">
        <label for="vol">select volume range </label>
        
        <input type="range" min="0" max="100" step="5" value="10" id="vol" name="vol">
        <button>submit</button>
    </form>
</body>
</html>
